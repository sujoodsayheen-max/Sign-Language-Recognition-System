name: CI Pipeline

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Check Python Files
        run: |
          python -m py_compile train_landmark_model.py
          python -m py_compile realtime_asl_predictor.py
          python -m py_compile step1_extract_landmarks_improved.py

      - name: Verify Files
        run: |
          test -f requirements.txt
          test -f README.md

      - name: Success
        run: echo "CI Pipeline Passed"